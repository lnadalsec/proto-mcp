# Exceptions datées lues par OSV-Scanner (workflow « Sécurité », job dependances-osv).
# Chaque exception renvoie à un ticket (risque, date de réexamen) et expire d'elle-même
# à la date ignoreUntil : ne pas la prolonger sans réanalyse.
#
# [[IgnoredVulns]]
# id = "GO-AAAA-NNNN"
# ignoreUntil = 2026-12-31T00:00:00Z
# reason = "Non atteignable (govulncheck), correctif bloqué par la directive replace ProtonMail. Ticket #N."

# x/crypto/openpgp déprécié (avis sans correctif, « unsafe by design »). Le projet ne l'importe
# pas : go list -deps ./... | grep x/crypto/openpgp est vide, et govulncheck le confirme
# (non atteignable). L'OpenPGP utilisé est github.com/ProtonMail/go-crypto. Réexamen à l'échéance.
[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2027-01-09T00:00:00Z
reason = "Paquet x/crypto/openpgp non importé (go list -deps), non atteignable (govulncheck). OpenPGP via ProtonMail/go-crypto."
