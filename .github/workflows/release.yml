name: Release (PARKED — manual dispatch only)

# Phase 7/E — automated release pipeline. PARKED FOR NOW: the MVP
# uses local-only signing via `make release VERSION=v1.0.0` (see
# scripts/release-howto.md) so the Developer ID cert + private key
# never leave the maintainer's machine.
#
# Trigger is set to `workflow_dispatch` (manual) so this file
# documents the eventual automation without firing on tag push.
# When release cadence grows or additional maintainers join,
# switch the trigger back to `push: tags: - "v*"` after adding the
# six secrets below.
#
# Required repository secrets when re-activating:
#
#   APPLE_DEVELOPER_ID_CERT_P12_BASE64
#     base64 of the .p12 export of the Developer ID Application
#     cert (private key + cert chain). Imported into a temporary
#     keychain at runtime; discarded with the runner.
#
#   APPLE_DEVELOPER_ID_CERT_PASSWORD
#     The .p12 export password.
#
#   APPLE_DEVELOPER_ID
#     The signing identity string:
#     "Developer ID Application: <NAME> (<TEAMID>)"
#
#   APPLE_NOTARY_APPLE_ID
#     Apple ID email used for notarytool submission.
#
#   APPLE_NOTARY_TEAM_ID
#     Developer Team ID (e.g. 346JJCHZP7).
#
#   APPLE_NOTARY_PASSWORD
#     App-specific password from appleid.apple.com, generated
#     specifically for notarytool. Stored verbatim.

on:
  workflow_dispatch:
  # When ready to enable: uncomment the lines below to fire on tag
  # push instead of (or in addition to) the manual trigger.
  #push:
  #  tags:
  #    - "v*"

permissions: {}

jobs:
  release:
    runs-on: macos-14
    # Secrets Apple accessibles uniquement via l'environnement « release »
    # (relecteur obligatoire, branche/tags protégés) — pas au niveau du dépôt.
    environment: release
    permissions:
      contents: write      # création de la release et envoi des archives
      id-token: write      # attestation de provenance (Sigstore)
      attestations: write  # publication de l'attestation
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # See ci.yml: sourced from go.mod so the toolchain always
          # satisfies the declared floor.
          go-version-file: go.mod
          # Pas de cache dans un job qui signe : un cache empoisonné par une
          # autre exécution finirait dans un binaire notarisé.
          cache: false

      # Lancé à la main depuis une branche, GITHUB_REF_NAME vaudrait « main »
      # et l'archive s'appellerait protonmcp-main.tar.gz.
      - name: Exécution depuis un tag vX.Y.Z uniquement
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ] || ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=Release::lancer depuis un tag vX.Y.Z (ref actuelle : $GITHUB_REF_NAME)"
            exit 1
          fi

      # The cert/key are imported into a transient keychain so the
      # runner's default login keychain stays untouched. The keychain
      # is unlocked, allow-listed for codesign, then deleted in the
      # post-step regardless of success/failure.
      - name: Import Developer ID cert
        env:
          CERT_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Random keychain password — never reused, lifecycle == job.
          # Utilisé seulement dans cette étape : ne pas l'exporter dans $GITHUB_ENV,
          # où toutes les étapes suivantes le liraient.
          # Jamais affiché, donc pas de commande add-mask (qui l'écrirait elle-même dans
          # le journal si les commandes de workflow étaient suspendues).
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          # Decode the .p12.
          echo "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # Create the transient keychain.
          KEYCHAIN_PATH="$RUNNER_TEMP/protonmcp-release.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make our keychain the SEARCH default so codesign finds the
          # cert. Login keychain stays in the search list as fallback.
          # shellcheck disable=SC2046 # découpage voulu : une entrée par trousseau
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Import + allow codesign to use the cert without prompting.
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$RUNNER_TEMP/cert.p12"

          # Sanity: confirm the cert is visible.
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials protonmcp-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Build all binaries
        run: make all

      - name: Sign
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: make sign

      - name: Verify signatures
        run: make verify-sign

      - name: Notarize
        run: make notarize

      - name: Verify notarization
        # Online lookup can take a beat after notarytool returns
        # Accepted; one retry handles flakiness without hiding real
        # rejections.
        run: |
          set -e
          if ! make verify-notarized; then
            echo "First verify-notarized attempt failed; waiting 30s for Apple to propagate ticket..."
            sleep 30
            make verify-notarized
          fi

      - name: Package release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="$RUNNER_TEMP/protonmcp-$VERSION"
          mkdir -p "$STAGE"

          # Lay out as a single flat directory — the Homebrew cask
          # `binary` stanzas pull each file directly from the
          # extracted root. helpers/ subdirs aren't preserved; the
          # path-resolution code looks in the same dir as the
          # running binary (Phase 7/E layout) as well as the dev
          # layout.
          cp bin/protonmcp        "$STAGE/protonmcp"
          cp bin/protonmcpd       "$STAGE/protonmcpd"
          cp bin/protonmcp-shim   "$STAGE/protonmcp-shim"
          cp helpers/touchid/protonmcp-touchid     "$STAGE/protonmcp-touchid"
          cp helpers/lockwatch/protonmcp-lockwatch "$STAGE/protonmcp-lockwatch"
          cp LICENSE README.md SECURITY.md "$STAGE/"

          # Tarball (Homebrew prefers .tar.gz for casks-of-binaries;
          # also gives us a deterministic sha256 to bake into the
          # cask formula).
          cd "$RUNNER_TEMP"
          tar -czf "protonmcp-$VERSION.tar.gz" "protonmcp-$VERSION"
          shasum -a 256 "protonmcp-$VERSION.tar.gz" > "protonmcp-$VERSION.tar.gz.sha256"

          {
            echo "STAGE_DIR=$STAGE"
            echo "ARTIFACT_TGZ=$RUNNER_TEMP/protonmcp-$VERSION.tar.gz"
            echo "ARTIFACT_SHA=$RUNNER_TEMP/protonmcp-$VERSION.tar.gz.sha256"
          } >> "$GITHUB_ENV"

      - name: Attestation de provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT_TGZ }}

      # gh (préinstallé) plutôt qu'une action tierce : rien d'externe ne s'exécute
      # avec contents: write pendant que la clé Developer ID est dans le trousseau.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Brouillon : le mainteneur relit avant publication.
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag \
            "$ARTIFACT_TGZ" "$ARTIFACT_SHA"

      - name: Cleanup keychain
        if: always()
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
