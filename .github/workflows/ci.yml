name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the version straight from go.mod's `go` directive rather
          # than pinning a literal here. "1.26.x" resolved to 1.26.4 even
          # after 1.26.5 shipped, and setup-go exports GOTOOLCHAIN=local,
          # so Go could not self-upgrade — raising the go.mod floor to
          # clear a stdlib CVE broke every job with "go.mod requires go >=
          # 1.26.5 (running go 1.26.4)". Sourcing both from one place
          # means the toolchain and the floor cannot drift apart again.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: build touchid helper
        # Phase 4/C — the Swift helper for Touch ID prompts. macos-14
        # has swiftc preinstalled. We verify it BUILDS here even
        # though no Go test exercises it; the broker tests use a
        # POSIX shell-script fixture so they're fast and don't need
        # biometric hardware.
        run: make touchid

      - name: go test
        run: go test -race ./...

  # NOTE: golangci-lint job is intentionally absent. v1.64.8 (the latest
  # v1 release as of 2026-05) was built with Go 1.24 and refuses to load
  # configs targeting Go 1.26 ("the Go language version used to build
  # golangci-lint is lower than the targeted Go version"). v2.x is a
  # rewrite with breaking config-schema changes. Adding lint back is
  # tracked as a Phase-1.5 follow-up — either pin a v2 build that
  # supports 1.26 and rewrite .golangci.yml, or wait for golangci-lint
  # to ship a 1.26-built v1 patch release.
